# 复制为本目录的 config.yaml 后再填写。config.yaml 已被 git 忽略，不要提交 API Key。
# 也可以不写文件，改用环境变量 XSAGENT_DEEPSEEK_API_KEY / XSAGENT_LLM_MODE。

server:
  host: 0.0.0.0
  port: 8000
  cors_origins:
    - http://localhost:5173
    - http://127.0.0.1:5173

llm:
  # simulator（无密钥，适合试用）| ollama | deepseek
  mode: simulator
  ollama_base_url: http://localhost:11434
  ollama_model: qwen2.5:14b
  ollama_think: false
  strip_think_tags: true
  deepseek_base_url: https://api.deepseek.com
  deepseek_api_key: ""
  deepseek_model: deepseek-v4-flash
  deepseek_reasoning_effort: high
  deepseek_thinking_enabled: true

logging:
  level: info
